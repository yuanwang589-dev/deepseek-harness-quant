name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 只装测试链依赖；requirements.txt 含 jqdatasdk 等无法在 PyPI 安装的包
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "scipy>=1.10" "pyyaml>=6.0" "plotly>=5.18"

      - name: Compile all Python files
        run: python -m compileall -q . -x '(\.venv|node_modules|__pycache__)'

      - name: Risk gate regression tests
        run: python validation/test_risk_gate.py

      - name: Backtest bias regression tests
        run: python validation/test_backtest_bias.py
